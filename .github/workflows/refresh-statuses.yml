name: Refresh MLB player statuses

# Keeps player_id_map's current team / roster status / IL type / age in step with
# the real MLB, instead of freezing them at whenever the owner last synced. That
# staleness is what had the app asserting players' old teams in trade and waiver
# prompts (the NFL half of the same bug is fixed on read; MLB has no single dump
# to overlay, so it's refreshed on a schedule).
#
# Costs nothing: plain MLB Stats API, no AI spend, and the bulk endpoint does
# ~300 players in 3 requests. Every 6 hours is well inside how fast an IL move
# or a trade matters, and the endpoint only touches leagues someone has opened
# recently.
#
# Secrets: KEEPWARM_URL (backend base URL) and CRON_SECRET (must match the
# backend's CRON_SECRET env var) — the same pair the widget refresh uses. If
# either is unset the job no-ops.

on:
  schedule:
    - cron: "37 */6 * * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger status refresh
        env:
          KEEPWARM_URL: ${{ secrets.KEEPWARM_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$KEEPWARM_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "KEEPWARM_URL or CRON_SECRET not set; skipping."
            exit 0
          fi
          # -L matters: without it a 301/308 (apex -> www, http -> https, a
          # trailing-slash rewrite) is NOT an error to curl's -f, so curl exits 0
          # with an empty body and the job reports success while the backend was
          # never reached. That is how this job can look green and do nothing.
          # Check the status code explicitly and print the body, so a run that
          # did nothing cannot read the same as one that worked.
          URL="${KEEPWARM_URL%/}/cron/refresh-statuses"
          code=$(curl -sS -L --max-time 300 -o /tmp/cron-body.txt -w '%{http_code}' -X POST "$URL" -H "x-cron-secret: $CRON_SECRET") || true
          echo "HTTP $code"
          cat /tmp/cron-body.txt; echo
          if [ "$code" != "200" ]; then
            echo "::error::expected HTTP 200 from /cron/refresh-statuses, got '$code'"
            exit 1
          fi

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # Advisory only for now — the existing codebase has a lint backlog.
      # `next build` (below) is the hard gate and runs the TypeScript check.
      - run: npm run lint
        continue-on-error: true
      - run: npm run build
        env:
          # Build-time only; real values come from Railway env at runtime.
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # Pin ruff — unpinned it floats to whatever released last, and 0.16.0
      # turned on a batch of new default rules (ISC/I001/…) that red-lit the
      # whole repo overnight with pre-existing style nits. Bump deliberately.
      - run: pip install -r requirements.txt ruff==0.15.21
      - run: ruff check .
      - name: Import smoke test
        env:
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_KEY: dummy-service-key
          ANTHROPIC_API_KEY: dummy-anthropic-key
        run: python -c "import api.main; print('import OK')"

name: Keep backend warm

# Pings the backend /health every 10 minutes so Railway doesn't cold-start on
# the next user request. This is a fallback — the real fix is disabling App
# Sleeping on the Railway service. Set repo secret KEEPWARM_URL to the backend's
# public base URL (e.g. https://dynastyops-api.up.railway.app); if unset, the
# job no-ops. GitHub scheduled runs are best-effort and can be delayed.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        env:
          KEEPWARM_URL: ${{ secrets.KEEPWARM_URL }}
        run: |
          if [ -z "$KEEPWARM_URL" ]; then
            echo "KEEPWARM_URL not set; skipping."
            exit 0
          fi
          curl -fsS --max-time 30 "${KEEPWARM_URL%/}/health" && echo " — warm"

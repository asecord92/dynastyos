# Morning digest: one fast call — the backend warms the widgets and sends the
# emails as a background job (a live HTTP request would be cut by Railway's
# ~5-minute edge timeout; the first run died exactly that way). The run's
# outcome lands in app_events, visible on the admin page.
#
# Schedule is UTC — 16:00 UTC = 9:00 AM PDT (8:00 AM in winter PST; GitHub cron
# can also drift a few minutes at busy times, both fine for a morning email).
#
# Secrets: API_URL (Railway backend base URL, no trailing slash) and
# CRON_SECRET (must match the backend's CRON_SECRET env var).
name: Daily Digest

on:
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch: {}

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger digest
        run: |
          curl -sS --fail-with-body --max-time 60 -X POST \
            "$API_URL/cron/daily-digest" \
            -H "x-cron-secret: $CRON_SECRET"
    env:
      API_URL: ${{ secrets.API_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}

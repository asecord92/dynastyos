name: Refresh dashboard widgets

# Re-warms each active league's AI widgets (news / start_sit / waiver) every 3
# hours, before their 4h cache lapses — so users always hit warm cache and never
# trigger a slow on-demand generation. Set repo secrets KEEPWARM_URL (backend
# base URL) and CRON_SECRET (must match the backend's CRON_SECRET env var); if
# either is unset the job no-ops. A Railway cron service is a more reliable
# trigger than GitHub's best-effort scheduler if you prefer.

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger widget refresh
        env:
          KEEPWARM_URL: ${{ secrets.KEEPWARM_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$KEEPWARM_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "KEEPWARM_URL or CRON_SECRET not set; skipping."
            exit 0
          fi
          # -L matters: without it a 301/308 (apex -> www, http -> https, a
          # trailing-slash rewrite) is NOT an error to curl's -f, so curl exits 0
          # with an empty body and the job reports success while the backend was
          # never reached. That is how this job can look green and do nothing.
          # Check the status code explicitly and print the body, so a run that
          # did nothing cannot read the same as one that worked.
          URL="${KEEPWARM_URL%/}/cron/refresh-widgets"
          # num_redirects is the diagnostic: a healthy KEEPWARM_URL hits the
          # backend directly. Anything above 0 means we are relying on -L to
          # save us, which also means a 301/302 would silently downgrade this
          # POST to a GET. Worth knowing before it bites.
          out=$(curl -sS -L --max-time 120 -o /tmp/cron-body.txt -w '%{http_code} %{num_redirects}' -X POST "$URL" -H "x-cron-secret: $CRON_SECRET") || true
          code=${out%% *}
          redirects=${out##* }
          echo "HTTP $code (redirects: $redirects)"
          if [ "$redirects" != "0" ]; then
            echo "::warning::KEEPWARM_URL redirected $redirects time(s) — point it at the canonical backend URL"
          fi
          cat /tmp/cron-body.txt; echo
          if [ "$code" != "200" ]; then
            echo "::error::expected HTTP 200 from /cron/refresh-widgets, got '$code'"
            exit 1
          fi
